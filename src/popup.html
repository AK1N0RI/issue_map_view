<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Issue Map View</title>
    <style>
      body {
        width: 360px;
        font-family: sans-serif;
        margin: 0;
        padding: 16px;
        background: #ffffff;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      .section {
        margin-top: 12px;
      }
      button {
        width: 100%;
        border: 1px solid #d0d7de;
        background: #f6f8fa;
        border-radius: 8px;
        padding: 8px 12px;
        margin-top: 8px;
        cursor: pointer;
      }
      .small {
        font-size: 12px;
        color: #57606a;
      }
    </style>
  </head>
  <body>
    <h1>Issues Map</h1>

    <div class="section">
      <div class="small">解析結果</div>
      <button id="new-analysis-result">新規作成</button>
      <button id="link-analysis-result">リンク</button>
    </div>

    <div class="section">
      <div class="small">対策</div>
      <button id="new-countermeasure">新規作成</button>
      <button id="link-countermeasure">リンク</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
