<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Issue Map View</title>
    <style>
      body {
        width: 360px;
        font-family: sans-serif;
        margin: 0;
        padding: 16px;
        background: #ffffff;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      .section {
        margin-top: 12px;
      }
      button {
        width: 100%;
        border: 1px solid #d0d7de;
        background: #f6f8fa;
        border-radius: 8px;
        padding: 8px 12px;
        margin-top: 8px;
        cursor: pointer;
      }
      .small {
        font-size: 12px;
        color: #57606a;
      }
      #issue-create-status {
        color: #cf222e;
        font-size: 12px;
      }
      .token-input {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        padding: 8px;
        margin-top: 6px;
      }
      #pat-status {
        min-height: 16px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Issues Map</h1>
    <p id="issue-create-status" role="status"></p>

    <div class="section">
      <div class="small">解析結果</div>
      <button id="new-analysis-result">新規作成</button>
      <button id="link-analysis-result">リンク</button>
    </div>

    <div class="section">
      <div class="small">対策</div>
      <button id="new-countermeasure">新規作成</button>
      <button id="link-countermeasure">リンク</button>
    </div>

    <div class="section">
      <label class="small" for="github-pat">GitHub Fine-grained PAT</label>
      <input id="github-pat" class="token-input" type="password" autocomplete="off" spellcheck="false" />
      <div class="small">対象リポジトリの Issues: Read and write 権限が必要です。トークンはブラウザーまたは拡張機能を再起動・再読み込みするまで保存されます。</div>
      <button id="save-github-pat" type="button">PATを保存</button>
      <button id="clear-github-pat" type="button">PATを削除</button>
      <p id="pat-status" role="status" aria-live="polite"></p>
      <button id="open-extension-settings" type="button">拡張機能の設定を開く</button>
    </div>

    <script src="pat-settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
