name: Extension CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: extension-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-security:
    name: Tests and security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm ci --prefix test

      - name: Install Playwright Chromium
        run: test/node_modules/.bin/playwright install --with-deps chromium

      - name: Run module, E2E, and extension security tests
        run: npm test

      - name: Audit test dependencies
        run: npm audit --prefix test --audit-level=high

  release:
    name: Package and publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-security
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release tag and extension version
        run: node scripts/verify-release-version.mjs "${GITHUB_REF_NAME}"

      - name: Package Chrome extension and checksum
        run: npm run package:extension

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/issue-map-view-v*.zip
            dist/SHA256SUMS.txt
